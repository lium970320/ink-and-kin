name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

  schema:
    name: Schema check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mirrai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `drizzle-kit push` is used rather than `generate && migrate`: the
      # migration journal lives in `drizzle/meta/`, which is gitignored, so
      # `migrate` cannot work on a fresh checkout.
      - name: Apply schema
        run: pnpm exec drizzle-kit push --force

      - name: Verify the schema is in sync
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Drizzle can recreate equivalent constraints or indexes when it
          # compares its definitions with PostgreSQL's normalized definitions.
          dump_schema() {
            docker exec "$POSTGRES_CONTAINER" pg_dump --schema-only --no-owner \
              --no-privileges --restrict-key=InkAndKinSchemaCheck \
              --username=postgres --dbname=mirrai
          }
          dump_schema > "$RUNNER_TEMP/schema-before.sql"
          pnpm exec drizzle-kit push --verbose
          dump_schema > "$RUNNER_TEMP/schema-after.sql"
          diff -u "$RUNNER_TEMP/schema-before.sql" "$RUNNER_TEMP/schema-after.sql"

      # The hand-written migrations must be idempotent — re-running them
      # against an already-migrated database has to be a no-op.
      - name: Verify the SQL migrations are idempotent
        run: |
          pnpm db:migrate
          pnpm db:migrate
